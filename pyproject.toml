[project]
name = "aegis-trialshield-lab"
version = "0.1.0"
description = "CEPF128-L400: Deconstruct the Monolithic Mega Agent and Architect a Secure Healthcare Multi-Agent Mesh"
authors = [
    {name = "Security Architect", email = "security@example.com"},
]

dependencies = [
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.9.2,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2026.10.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "fastmcp>=4.1.0",
    "mcp>=2.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "ruff>=0.4.6,<1.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.9.2,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<2.0.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",
    "I001",
    "F841",
    "FURB167",
    "S110",
    "SIM102",
    "RET501",
    "F401",
    "RUF059",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app", "legacy_mega_agent", "lego_blocks", "agents", "mcp_servers"]
